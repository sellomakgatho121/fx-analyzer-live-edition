name: CI — Lint, Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint || echo "Lint warnings found (non-blocking)"
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
        # Note: on low-memory/Android Termux devices `npm run build` can hang the
        # next bundler; use `npm run build -- --webpack` as the local fallback.
        # CI on ubuntu-latest uses the default Turbopack bundler.

  backend-tests:
    name: Backend Tests & Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - name: Syntax check
        run: cd backend && node --check server.js
      - name: Run test suite (node:test)
        run: cd backend && node --test "tests/*.test.cjs"

  engine-compile:
    name: Engine compile check (py_compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: py_compile all engine modules
        run: |
          cd engine
          python - <<'PY'
          import compileall, pathlib
          src = pathlib.Path(".")
          ok = compileall.compile_dir(str(src), quiet=1, force=True)
          print("engine py_compile:", "OK" if ok else "FAILED")
          raise SystemExit(0 if ok else 1)
          PY